name: Build and Release Wii App

on:
  workflow_dispatch: # This enables the manual "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix git ownership issue
        run: git config --global --add safe.directory '*'

      - name: Compile Project
        run: make

      - name: Install Zip & GitHub CLI utilities
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y zip curl && curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null && apt-get update && apt-get install gh -y

      - name: Package Homebrew Zip
        run: |
          mkdir -p apps/WiiMotionSynth
          cp build/WiiMotionSynth.dol apps/WiiMotionSynth/boot.dol
          cp meta.xml apps/WiiMotionSynth/
          cp icon.png apps/WiiMotionSynth/
          zip -r WiiMotionSynth-latest.zip apps/

      - name: Publish Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest WiiMotionSynth-latest.zip --title "Latest Development Build" --notes "Manually compiled bleeding-edge version." --prerelease
